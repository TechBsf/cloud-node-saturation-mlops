<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" width="1280" height="590" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="590" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="24" y="20" width="1232" height="58" rx="10" fill="#0f172a"/>
  <circle cx="52" cy="49" r="9" fill="#38bdf8"/>
  <text x="72" y="45" font-size="19" font-weight="700" fill="#ffffff">Cloud Compute Node Saturation Risk — MLOps Architecture</text>
  <text x="72" y="65" font-size="12" fill="#cbd5e1">XGBoost + MLflow + FastAPI (ComputeNodeTelemetry -> saturation_risk_score) + Docker + Amazon ECR + Amazon ECS Fargate + pytest</text>
  <rect x="24" y="100" width="380" height="380" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="24" y="100" width="380" height="36" rx="12" fill="#ea580c"/>
  <text x="42" y="123" font-size="13.5" font-weight="700" fill="#ffffff">1. Training &amp; MLflow Tracking</text>
  <rect x="46" y="152" width="336" height="62" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="62" y="178" font-size="13" font-weight="700" fill="#9a3412">data/compute_capacity.csv</text>
  <text x="62" y="199" font-size="11.5" fill="#7c2d12">cpu, memory, rps, p99_latency, queue_depth, uptime</text>
  <line x1="214" y1="214" x2="214" y2="246" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="46" y="250" width="336" height="74" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="62" y="276" font-size="13" font-weight="700" fill="#1e3a8a">scripts/train_with_mlflow.py</text>
  <text x="62" y="297" font-size="11.5" fill="#1d4ed8">XGBRegressor + MLflow Runs, Params &amp; Metrics</text>
  <text x="62" y="315" font-size="11" fill="#3b82f6">Target: saturation_risk_score in [0.0, 1.0]</text>
  <line x1="214" y1="324" x2="214" y2="356" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="46" y="360" width="336" height="62" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="62" y="386" font-size="13" font-weight="700" fill="#166534">model/model.joblib</text>
  <text x="62" y="407" font-size="11.5" fill="#15803d">Versioned XGBoost inference artifact</text>
  <rect x="450" y="100" width="380" height="380" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="450" y="100" width="380" height="36" rx="12" fill="#0284c7"/>
  <text x="468" y="123" font-size="13.5" font-weight="700" fill="#ffffff">2. Schema Contract &amp; Inference API</text>
  <rect x="472" y="152" width="336" height="62" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="488" y="178" font-size="13" font-weight="700" fill="#0369a1">ComputeNodeTelemetry (src/schema.py)</text>
  <text x="488" y="199" font-size="11.5" fill="#0284c7">Strict Pydantic range &amp; type validation</text>
  <line x1="640" y1="214" x2="640" y2="246" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="472" y="250" width="336" height="74" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="488" y="276" font-size="13" font-weight="700" fill="#312e81">FastAPI Service — POST /predict</text>
  <text x="488" y="297" font-size="11.5" fill="#4338ca">scripts/app.py loads model/model.joblib</text>
  <text x="488" y="315" font-size="11" fill="#4f46e5">Real-time node saturation scoring</text>
  <line x1="640" y1="324" x2="640" y2="356" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="472" y="360" width="336" height="62" rx="8" fill="#fefce8" stroke="#facc15" stroke-width="1.5"/>
  <text x="488" y="386" font-size="13" font-weight="700" fill="#854d0e">saturation_risk_score [0.0 - 1.0]</text>
  <text x="488" y="407" font-size="11.5" fill="#a16207">Actionable saturation risk signal</text>
  <rect x="876" y="100" width="380" height="380" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="876" y="100" width="380" height="36" rx="12" fill="#0f766e"/>
  <text x="894" y="123" font-size="13.5" font-weight="700" fill="#ffffff">3. CI Quality Gates &amp; AWS Cloud</text>
  <rect x="898" y="152" width="336" height="62" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="914" y="178" font-size="13" font-weight="700" fill="#115e59">.github/workflows/ci.yml (pytest)</text>
  <text x="914" y="199" font-size="11.5" fill="#0f766e">API, schema, model gate &amp; smoke tests</text>
  <line x1="1066" y1="214" x2="1066" y2="246" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="898" y="250" width="336" height="74" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="914" y="276" font-size="13" font-weight="700" fill="#0f172a">Docker Image + Amazon ECR</text>
  <text x="914" y="297" font-size="11.5" fill="#334155">Container build (.dockerignore) &amp; push</text>
  <text x="914" y="315" font-size="11" fill="#475569">Versioned image for cloud runtime</text>
  <line x1="1066" y1="324" x2="1066" y2="356" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="898" y="360" width="336" height="62" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="914" y="386" font-size="13" font-weight="700" fill="#9a3412">Amazon ECS Fargate</text>
  <text x="914" y="407" font-size="11.5" fill="#c2410c">Serverless container inference runtime</text>
  <path d="M 382 391 L 416 391 L 416 287 L 468 287" fill="none" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr)"/>
  <path d="M 808 287 L 842 287 L 842 183 L 894 183" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="24" y="496" width="1232" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="518" font-size="13" font-weight="700" fill="#0f172a">ML &amp; MLOps Principles</text>
  <text x="42" y="538" font-size="11.5" fill="#334155">• ML Principle: XGBRegressor models non-linear capacity pressure across cpu, memory, rps, p99_latency, queue_depth &amp; uptime -> saturation_risk_score [0.0..1.0].</text>
  <text x="42" y="556" font-size="11.5" fill="#334155">• MLOps Principle: MLflow run tracking + model.joblib artifact + ComputeNodeTelemetry contract + pytest quality gates + Docker / Amazon ECR / Amazon ECS Fargate.</text>
</svg>