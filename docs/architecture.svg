<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="540" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="32" y="42" font-size="22" font-weight="700" fill="#0f172a">Cloud Compute Node Saturation Risk — MLOps Architecture</text>
  <text x="32" y="66" font-size="13" fill="#475569">XGBoost + MLflow + FastAPI (ComputeNodeTelemetry -> saturation_risk_score) + Docker + Amazon ECR + Amazon ECS Fargate + pytest</text>

  <!-- Zone 1: Training & MLOps -->
  <rect x="32" y="92" width="350" height="412" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="32" y="92" width="350" height="36" rx="10" fill="#ea580c"/>
  <text x="48" y="115" font-size="14" font-weight="700" fill="#ffffff">1. Training &amp; MLflow Tracking</text>
  <rect x="56" y="150" width="302" height="64" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="70" y="176" font-size="13" font-weight="700" fill="#9a3412">data/compute_capacity.csv</text>
  <text x="70" y="198" font-size="12" fill="#7c2d12">Node telemetry &amp; saturation_risk_score</text>
  <line x1="207" y1="214" x2="207" y2="246" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="56" y="250" width="302" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="70" y="276" font-size="13" font-weight="700" fill="#1e40af">scripts/train_with_mlflow.py</text>
  <text x="70" y="298" font-size="12" fill="#1d4ed8">XGBRegressor + MLflow runs &amp; metrics</text>
  <line x1="207" y1="322" x2="207" y2="354" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="56" y="358" width="302" height="64" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="70" y="384" font-size="13" font-weight="700" fill="#166534">model/model.joblib</text>
  <text x="70" y="406" font-size="12" fill="#15803d">Versioned inference artifact</text>

  <!-- Zone 2: FastAPI Inference -->
  <rect x="425" y="92" width="350" height="412" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="425" y="92" width="350" height="36" rx="10" fill="#0284c7"/>
  <text x="441" y="115" font-size="14" font-weight="700" fill="#ffffff">2. Inference API Contract</text>
  <rect x="449" y="150" width="302" height="64" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="463" y="176" font-size="13" font-weight="700" fill="#0369a1">ComputeNodeTelemetry (src/schema.py)</text>
  <text x="463" y="198" font-size="11.5" fill="#0284c7">cpu, memory, rps, p99_latency, queue, uptime</text>
  <line x1="600" y1="214" x2="600" y2="246" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="449" y="250" width="302" height="72" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="463" y="276" font-size="13" font-weight="700" fill="#3730a3">FastAPI: POST /predict (scripts/app.py)</text>
  <text x="463" y="298" font-size="12" fill="#4338ca">Strict Pydantic input validation</text>
  <line x1="600" y1="322" x2="600" y2="354" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="449" y="358" width="302" height="64" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <text x="463" y="384" font-size="13" font-weight="700" fill="#854d0e">saturation_risk_score [0.0 - 1.0]</text>
  <text x="463" y="406" font-size="12" fill="#a16207">Real-time node saturation risk output</text>

  <!-- Zone 3: CI/CD & AWS Cloud -->
  <rect x="818" y="92" width="350" height="412" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="818" y="92" width="350" height="36" rx="10" fill="#0f766e"/>
  <text x="834" y="115" font-size="14" font-weight="700" fill="#ffffff">3. CI/CD &amp; AWS Cloud Delivery</text>
  <rect x="842" y="150" width="302" height="64" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="856" y="176" font-size="13" font-weight="700" fill="#115e59">.github/workflows/ci.yml (pytest)</text>
  <text x="856" y="198" font-size="12" fill="#0f766e">API, schema, model &amp; smoke gates</text>
  <line x1="993" y1="214" x2="993" y2="246" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="842" y="250" width="302" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="856" y="276" font-size="13" font-weight="700" fill="#1e293b">Docker Image + Amazon ECR</text>
  <text x="856" y="298" font-size="12" fill="#475569">Container build &amp; registry push</text>
  <line x1="993" y1="322" x2="993" y2="354" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="842" y="358" width="302" height="64" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="856" y="384" font-size="13" font-weight="700" fill="#9a3412">Amazon ECS Fargate</text>
  <text x="856" y="406" font-size="12" fill="#c2410c">Serverless container inference runtime</text>

  <!-- Cross-zone arrows -->
  <line x1="358" y1="390" x2="445" y2="286" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="751" y1="286" x2="838" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
</svg>