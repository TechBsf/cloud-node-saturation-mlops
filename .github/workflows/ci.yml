name: MLOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff (Linting)
        run: ruff check .

      - name: Run Mypy (Type Checking)
        run: mypy .

      - name: Train model (produces model/model.joblib)
        run: python scripts/train_with_mlflow.py

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-model
          path: |
            model/model.joblib
            model/model_metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Run pytest suite
        run: pytest -v

      - name: Build Docker image
        run: docker build -t compute-capacity-mlops:ci .

      - name: Smoke test container
        run: |
          cleanup() {
            docker rm -f api-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name api-test -p 8000:8000 compute-capacity-mlops:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null; then
              echo "API ready"
              curl -fsS \
                -H 'Content-Type: application/json' \
                -d '{"cpu_utilization_pct":57.48,"memory_utilization_pct":48.94,"request_rate_rps":200.15,"p99_latency_ms":32.16,"queue_depth":4,"uptime_hours":1602}' \
                http://127.0.0.1:8000/predict
              curl -fsS http://127.0.0.1:8000/metrics
              docker logs api-test
              exit 0
            fi
            sleep 1
          done
          docker logs api-test
          exit 1
