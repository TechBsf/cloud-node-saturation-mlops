<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="740" viewBox="0 0 1480 740">
  <defs>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #475569; }
      .lane-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 14.5px; font-weight: 700; fill: #0f172a; }
      .lane-sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #475569; }
      .card-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .card-text { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; fill: #334155; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #0f172a; }
      .badge-text { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
      .arrow-blue { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#m-blue); }
      .arrow-amber { stroke: #d97706; stroke-width: 2; fill: none; marker-end: url(#m-amber); }
      .arrow-green { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#m-green); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.9; stroke-dasharray: 5,4; fill: none; marker-end: url(#m-red); }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1480" height="740" fill="#ffffff"/>
  <text x="28" y="36" class="title">Cloud Node Saturation Risk — End-to-End MLOps Architecture</text>
  <text x="28" y="58" class="sub">Telemetry schema contract · Baseline vs XGBRegressor MLflow benchmark · 7/7 Pytest CI gates · FastAPI inference · AWS OIDC / IAM / SCP guardrails</text>

  <!-- Top Legend -->
  <rect x="975" y="22" width="14" height="14" rx="3" fill="#0284c7"/>
  <text x="995" y="33" class="card-text">Data &amp; Serving</text>
  <rect x="1095" y="22" width="14" height="14" rx="3" fill="#d97706"/>
  <text x="1115" y="33" class="card-text">Training &amp; MLflow</text>
  <rect x="1235" y="22" width="14" height="14" rx="3" fill="#16a34a"/>
  <text x="1255" y="33" class="card-text">CI Quality Gates</text>
  <rect x="1360" y="22" width="14" height="14" rx="3" fill="#dc2626"/>
  <text x="1380" y="33" class="card-text">AWS Guardrails</text>

  <!-- LANE 1: TELEMETRY & SCHEMA -->
  <rect x="28" y="82" width="288" height="626" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="46" y="108" class="lane-title">1. Telemetry &amp; Contract</text>
  <text x="46" y="126" class="lane-sub">Strict feature schema &amp; shapes</text>

  <rect x="46" y="146" width="252" height="206" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#shadow)"/>
  <rect x="46" y="146" width="252" height="28" rx="7" fill="#e2e8f0"/>
  <text x="60" y="164" class="card-title">Node Telemetry Features (6)</text>
  <text x="60" y="194" class="mono">cpu_utilization_pct</text>
  <text x="60" y="214" class="mono">memory_utilization_pct</text>
  <text x="60" y="234" class="mono">request_rate_rps</text>
  <text x="60" y="254" class="mono">p99_latency_ms</text>
  <text x="60" y="274" class="mono">queue_depth</text>
  <text x="60" y="294" class="mono">uptime_hours</text>
  <text x="60" y="324" class="card-text">Target: saturation_risk_score</text>

  <rect x="46" y="394" width="252" height="156" rx="7" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="46" y="394" width="252" height="28" rx="7" fill="#0284c7"/>
  <text x="60" y="412" class="badge-text">Schema &amp; Dimension Guard</text>
  <text x="60" y="442" class="mono">src/schema.py</text>
  <text x="60" y="463" class="card-text">Pydantic validation + feature order</text>
  <text x="60" y="483" class="card-text">Blocks invalid payloads &amp; shape</text>
  <text x="60" y="503" class="card-text">mismatches before training or API</text>
  <text x="60" y="523" class="card-text">inference execution</text>

  <line x1="172" y1="352" x2="172" y2="392" class="arrow-blue"/>

  <!-- LANE 2: TRAINING & MLFLOW -->
  <rect x="362" y="82" width="436" height="626" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="380" y="108" class="lane-title">2. Training, Benchmark &amp; MLflow</text>
  <text x="380" y="126" class="lane-sub">Offline experimentation &amp; artifact packaging</text>

  <rect x="380" y="146" width="400" height="78" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="396" y="170" class="card-title">scripts/train_with_mlflow.py</text>
  <text x="396" y="191" class="card-text">Train / validation split (80/20, random_state=42)</text>
  <text x="396" y="211" class="card-text">Benchmarks linear baseline vs gradient boosted candidate</text>

  <rect x="380" y="256" width="188" height="108" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="394" y="279" class="card-title">Baseline</text>
  <text x="394" y="301" class="mono">LinearRegression</text>
  <text x="394" y="323" class="card-text">Linear reference model</text>
  <text x="394" y="343" class="card-text">on validation set</text>

  <rect x="592" y="256" width="188" height="108" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="606" y="279" class="card-title">Candidate</text>
  <text x="606" y="301" class="mono">XGBRegressor</text>
  <text x="606" y="323" class="card-text">Captures non-linear</text>
  <text x="606" y="343" class="card-text">saturation curves</text>

  <rect x="380" y="396" width="400" height="118" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="380" y="396" width="400" height="28" rx="7" fill="#0f766e"/>
  <text x="396" y="414" class="badge-text">MLflow Tracking &amp; Git Hygiene</text>
  <text x="396" y="444" class="card-text">Logs hyperparameters, RMSE, MAE, R² &amp; run artifacts</text>
  <text x="396" y="465" class="card-text">Local tracking state ignored via .gitignore:</text>
  <text x="396" y="487" class="mono">mlruns/   mlartifacts/   mlflow.db</text>

  <rect x="380" y="546" width="400" height="92" rx="7" fill="#ffffff" stroke="#0f172a" stroke-width="1.7" filter="url(#shadow)"/>
  <text x="396" y="571" class="card-title">Packaged Model Artifact</text>
  <text x="396" y="593" class="mono">model/model.joblib</text>
  <text x="396" y="614" class="card-text">Validated by model gate tests before serving</text>

  <line x1="474" y1="224" x2="474" y2="254" class="arrow-amber"/>
  <line x1="686" y1="224" x2="686" y2="254" class="arrow-amber"/>
  <line x1="474" y1="364" x2="474" y2="394" class="arrow-amber"/>
  <line x1="686" y1="364" x2="686" y2="394" class="arrow-amber"/>
  <line x1="580" y1="514" x2="580" y2="544" class="arrow-amber"/>

  <!-- LANE 3: CI GATES & FASTAPI SERVING -->
  <rect x="844" y="82" width="302" height="626" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="862" y="108" class="lane-title">3. CI Gates &amp; Serving</text>
  <text x="862" y="126" class="lane-sub">Automated checks &amp; real-time API</text>

  <rect x="862" y="146" width="266" height="164" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="862" y="146" width="266" height="28" rx="7" fill="#16a34a"/>
  <text x="876" y="164" class="badge-text">GitHub Actions CI &amp; Pytest</text>
  <text x="876" y="194" class="mono">python -m compileall</text>
  <text x="876" y="214" class="mono">pytest -v (7/7 passing)</text>
  <text x="876" y="236" class="card-text">Schema, API contract, model gate</text>
  <text x="876" y="256" class="card-text">&amp; httpx2 / TestClient checks</text>
  <text x="876" y="276" class="card-text">+ Docker build verification</text>

  <rect x="862" y="346" width="266" height="292" rx="7" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="862" y="346" width="266" height="28" rx="7" fill="#0284c7"/>
  <text x="876" y="364" class="badge-text">FastAPI Service — scripts/app.py</text>
  <text x="876" y="394" class="mono">GET  /health</text>
  <text x="876" y="413" class="card-text">Service &amp; model readiness check</text>
  <text x="876" y="443" class="mono">POST /predict</text>
  <text x="876" y="462" class="card-text">Returns saturation_risk_score</text>
  <text x="876" y="494" class="card-text">Hardened runtime checks:</text>
  <text x="876" y="514" class="card-text">- Pydantic schema validation</text>
  <text x="876" y="534" class="card-text">- Feature dimension enforcement</text>
  <text x="876" y="554" class="card-text">- Loads model/model.joblib</text>

  <line x1="995" y1="310" x2="995" y2="344" class="arrow-green"/>

  <!-- LANE 4: AWS GUARDRAILS & CD -->
  <rect x="1192" y="82" width="260" height="626" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="1210" y="108" class="lane-title">4. AWS &amp; CD Guardrails</text>
  <text x="1210" y="126" class="lane-sub">Account 660178693695 controls</text>

  <rect x="1208" y="146" width="228" height="222" rx="7" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1208" y="146" width="228" height="28" rx="7" fill="#0f172a"/>
  <text x="1222" y="164" class="badge-text">Identity &amp; Least Privilege</text>
  <text x="1222" y="194" class="card-text">GitHub OIDC federation</text>
  <text x="1222" y="214" class="card-text">(short-lived tokens, no static</text>
  <text x="1222" y="234" class="card-text">AWS access keys in repo)</text>
  <text x="1222" y="266" class="card-text">Scoped IAM policies:</text>
  <text x="1222" y="286" class="mono">iam:PassRole</text>
  <text x="1222" y="306" class="mono">sts:AssumeRole</text>
  <text x="1222" y="328" class="card-text">(SageMaker execution context)</text>

  <rect x="1208" y="404" width="228" height="234" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.7" filter="url(#shadow)"/>
  <rect x="1208" y="404" width="228" height="28" rx="7" fill="#dc2626"/>
  <text x="1222" y="422" class="badge-text">SCP &amp; Rollout Gate</text>
  <text x="1222" y="452" class="mono">DEPLOY_ENABLED=false</text>
  <text x="1222" y="474" class="card-text">Explicit deployment gate in CD</text>
  <text x="1222" y="494" class="card-text">workflow on main branch</text>
  <text x="1222" y="526" class="card-text">Organizational AWS SCP blocks</text>
  <text x="1222" y="546" class="card-text">Amazon ECR pushes &amp; ECS</text>
  <text x="1222" y="566" class="card-text">Fargate deployments in account</text>
  <text x="1222" y="586" class="mono">660178693695</text>

  <line x1="1322" y1="368" x2="1322" y2="402" class="arrow-red"/>

  <!-- Dedicated routing corridors between lanes -->
  <path d="M 298 472 L 330 472 L 330 185 L 378 185" class="arrow-blue"/>
  <path d="M 780 592 L 812 592 L 812 492 L 860 492" class="arrow-blue"/>
  <path d="M 780 592 L 812 592 L 812 228 L 860 228" class="arrow-green"/>
  <path d="M 1128 228 L 1160 228 L 1160 257 L 1206 257" class="arrow-red"/>
</svg>
