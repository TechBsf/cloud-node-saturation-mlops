[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-node-saturation-mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline for predicting cloud node saturation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlflow==2.22.4",
    "pandas==2.2.3",
    "numpy==2.2.6",
    "scikit-learn==1.7.2",
    "xgboost==2.1.3",
    "joblib==1.4.2",
    "requests==2.32.3",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pydantic==2.11.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==4.1.0",
    "httpx==0.28.1",
    "ruff==0.11.9",
    "mypy==1.15.0",
    "pandas-stubs",
]

[tool.setuptools]
packages = ["src", "src.data", "src.models"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["^build/", "^dist/", "^\\.venv/", "^venv/", "tests/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
